<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brian Duffy Tarot</title>
  <meta name="description" content="Tarot readings, classes and resources from Brian Duffy. New site coming soon.">
  <style>
    :root { --ink:#f3e7c9; --gold:#d4a94e; --bg:#1c1220; }
    * { box-sizing:border-box; margin:0; }
    body {
      min-height:100vh; display:grid; place-items:center; padding:2rem;
      background: radial-gradient(ellipse at top, #3a2140 0%, var(--bg) 70%);
      color:var(--ink); font-family: Georgia, "Times New Roman", serif; text-align:center;
    }
    main { max-width:34rem; }
    .star { color:var(--gold); font-size:1.5rem; letter-spacing:.6em; }
    h1 { font-weight:normal; font-size:clamp(2rem,6vw,3.2rem); margin:1rem 0 .5rem; letter-spacing:.04em; }
    p { line-height:1.6; opacity:.85; }
    nav { margin-top:2rem; display:flex; gap:1.5rem; justify-content:center; flex-wrap:wrap; }
    a { color:var(--gold); text-decoration:none; border-bottom:1px solid transparent; }
    a:hover { border-color:var(--gold); }
  </style>
</head>
<body>
  <main>
    <div class="star" aria-hidden="true">✦ ✦ ✦</div>
    <h1>Brian Duffy Tarot</h1>
    <p>A new home for readings, classes and Tarot resources is on its way.</p>
    <nav>
      <a href="https://instagram.com/brianduffygram">Instagram</a>
      <a href="https://www.skool.com/the-arcana-conservatory-6657">The Arcana Conservatory</a>
    </nav>
  </main>
</body>
</html>
